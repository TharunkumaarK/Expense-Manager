<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
    <defs>
        <linearGradient id="em-bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#14161f"/>
            <stop offset="100%" stop-color="#08090d"/>
        </linearGradient>
        <linearGradient id="em-card-primary" x1="120" y1="140" x2="380" y2="340" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#3b82f6"/>
            <stop offset="100%" stop-color="#1d4ed8"/>
        </linearGradient>
        <linearGradient id="em-card-secondary" x1="140" y1="200" x2="400" y2="400" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
        </linearGradient>
        <filter id="em-glow" x="60" y="60" width="392" height="392" filterUnits="userSpaceOnUse">
            <feGaussianBlur stdDeviation="16" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    
    <!-- Outer Rounded Base -->
    <rect width="512" height="512" rx="128" fill="url(#em-bg-grad)"/>
    <rect x="1" y="1" width="510" height="510" rx="127" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
    
    <!-- Ambient Inner Glow -->
    <circle cx="256" cy="240" r="140" fill="#3b82f6" opacity="0.12" filter="url(#em-glow)"/>
    
    <!-- Back Card (Secondary / Glass Layer) -->
    <rect x="156" y="148" width="236" height="152" rx="20" transform="rotate(8 274 224)" fill="url(#em-card-secondary)" stroke="rgba(255,255,255,0.22)" stroke-width="3"/>
    
    <!-- Front Card (Primary Fintech Sapphire Surface) -->
    <rect x="120" y="200" width="248" height="158" rx="22" fill="url(#em-card-primary)" stroke="rgba(255,255,255,0.3)" stroke-width="2.5"/>
    
    <!-- Front Card EMV Chip Accent -->
    <rect x="152" y="234" width="44" height="34" rx="6" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" opacity="0.95"/>
    <line x1="152" y1="251" x2="196" y2="251" stroke="#b45309" stroke-width="1.5"/>
    <line x1="174" y1="234" x2="174" y2="268" stroke="#b45309" stroke-width="1.5"/>
    
    <!-- Contactless Wave Glyph -->
    <path d="M316 238 C324 246, 324 258, 316 266" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M328 230 C340 242, 340 262, 328 274" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    
    <!-- Currency Dots / Nodes (Yen & Rupee Balance Indicators) -->
    <circle cx="156" cy="324" r="5" fill="#ffffff" opacity="0.9"/>
    <circle cx="174" cy="324" r="5" fill="#ffffff" opacity="0.6"/>
    <circle cx="192" cy="324" r="5" fill="#ffffff" opacity="0.3"/>
    <circle cx="336" cy="324" r="14" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
    <circle cx="320" cy="324" r="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
</svg>
